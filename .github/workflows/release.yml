name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to release (for example 0.1.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve version
        id: resolve
        shell: bash
        env:
          RAW_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "SimplyCode preview releases use a plain stable semver (for example 0.1.0); got: $RAW_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build_bundle:
    name: Build JS bundle
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=simplycode... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Exercise release packaging helpers
        run: node scripts/release-smoke.ts

      - name: Build server, web, and desktop bundles
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

      - name: Build the npm launcher
        run: node scripts/build-npm-launcher.ts --version "${{ needs.prepare.outputs.version }}" --output-dir npm-packages

      - name: Upload the npm launcher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-launcher
          path: npm-packages/simplycode.tgz
          if-no-files-found: error
          retention-days: 30

  cli_linux_x64:
    name: Build Linux x64
    needs: [prepare, build_bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=simplycode... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$target_dir/t3-resource-monitor"

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ needs.prepare.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.prepare.outputs.version }}"

      - name: Upload CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          compression-level: 0

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [prepare, build_bundle, cli_linux_x64]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: stable
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true
      save_pnpm_store: false

  release:
    name: Publish GitHub Release
    needs: [prepare, build_bundle, cli_linux_x64, desktop_win_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          rm -f builder-debug*.yml
          if [[ ! -f latest-win-x64.yml ]]; then
            echo "Missing latest-win-x64.yml; the Windows updater feed was not produced." >&2
            exit 1
          fi
          mv latest-win-x64.yml latest.yml

          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          if [[ ${#archives[@]} -ne 2 ]]; then
            echo "Expected exactly the Linux and Windows CLI archives, got: ${archives[*]:-none}" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          ## SimplyCode v${VERSION} - public preview

          This is the first public preview of SimplyCode, an unofficial community fork of T3 Code.

          ### Included

          - Windows x64 desktop installer (unsigned)
          - Self-contained SimplyCode CLI archives for Windows x64 and Linux x64
          - The npm \`simplycode\` launcher
          - Bots, bot delegation, memory, import/export, teams, pipelines, Usage, and Telegram notifications from the fork

          ### Install

          Windows PowerShell:

          \`\`\`powershell
          irm https://raw.githubusercontent.com/kodji7202-code/simplycode/main/scripts/install.ps1 | iex
          \`\`\`

          Linux shell or npm (on a supported Windows x64 or Linux x64 machine):

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/kodji7202-code/simplycode/main/scripts/install.sh | sh
          npm install -g simplycode
          \`\`\`

          ### Known preview limitations

          - The Windows installer is unsigned, so SmartScreen may warn before running it.
          - macOS, signed installers, and the mobile apps are not part of this preview.
          - **Stay in project** does not stop commands already running in a terminal.
          - Bots with **Full** access can modify any file on the computer.
          - SimplyCode does not include a hosted relay. Use local pairing, LAN, Tailscale, SSH, or a relay you control.

          ### Verify downloads

          CLI archives are covered by the attached \`SHA256SUMS\` file.
          EOF

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REF: ${{ needs.prepare.outputs.ref }}
          TITLE: SimplyCode v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          assets=(*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were collected." >&2
            exit 1
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "${assets[@]}" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file ../release-notes.md
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${assets[@]}" --target "$REF" --title "$TITLE" --notes-file ../release-notes.md
          fi

  publish_npm:
    name: Publish npm launcher
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download npm launcher
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-launcher
          path: npm-packages

      - name: Publish launcher
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "NPM_TOKEN is missing. Add a granular npm token with publish permission and 2FA bypass." >&2
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          if npm view simplycode@"$VERSION" version >/dev/null 2>&1; then
            echo "simplycode@$VERSION is already published; skipping npm publish."
          elif ! npm publish --access public --tag latest --provenance ./npm-packages/simplycode.tgz; then
            echo "npm publish failed; checking whether the version was already published or is still propagating." >&2
          fi

          for attempt in {1..30}; do
            published="$(npm view simplycode@"$VERSION" version 2>/dev/null || true)"
            if [[ "$published" == "$VERSION" ]]; then
              echo "Verified simplycode@$VERSION on npm."
              exit 0
            fi
            if [[ $attempt -lt 30 ]]; then
              sleep 10
            fi
          done

          echo "simplycode@$VERSION did not become visible in the npm registry within five minutes." >&2
          exit 1
